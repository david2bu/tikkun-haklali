<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0F131B"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>תיקון הכללי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Bellefair&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one quiet reading column, sticky location bar on top, floating listen dock at the bottom */
:root{
  --bg:#F3F3F0; --surface:#FFFFFF; --ink:#1B2030; --muted:#6A7083; --line:#DEDFE4;
  --gold:#94681C; --gold-soft:rgba(178,132,52,.16); --said:#7C8091;
  --live:#2F7A55;
  --f-text:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --f-display:"Bellefair","Frank Ruhl Libre",serif;
  --f-ui:"Assistant","Segoe UI",Arial,sans-serif;
  --size:1.55rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --surface:#171C27; --ink:#ECE6D8; --muted:#8D93A5; --line:#273042;
  --gold:#D8B068; --gold-soft:rgba(216,176,104,.15); --said:#7F8597; --live:#6CC79A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#171C27; --ink:#ECE6D8; --muted:#8D93A5; --line:#273042;
  --gold:#D8B068; --gold-soft:rgba(216,176,104,.15); --said:#7F8597; --live:#6CC79A; color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px 6px}
.where{flex:1;min-width:0}
.where small{display:block;font-size:.78rem;letter-spacing:.04em;color:var(--muted)}
.where b{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.where b span{color:var(--gold)}
.tools{display:flex;gap:6px}
.tools button{font:600 .95rem var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:40px;height:38px;cursor:pointer}
.tools button:focus-visible,.chip:focus-visible,#mic:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.chips{max-width:46rem;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:600 .9rem var(--f-ui);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.done{color:var(--said);border-color:transparent;background:var(--gold-soft)}
.chip.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}

main{max-width:46rem;margin:0 auto;padding-block:20px 180px}
section{padding-block:26px 10px}
.head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.head h2{font-family:var(--f-display);font-weight:400;font-size:2.4rem;margin:0;color:var(--ink);line-height:1}
.head .lbl{font-size:.8rem;letter-spacing:.06em;color:var(--gold)}
.head .rule{flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
section.prayer .head h2{font-size:1.7rem}

.v{font-family:var(--f-text);font-size:var(--size);line-height:2.05;margin:0 0 .35em;padding:2px 10px 2px 8px;border-radius:12px;position:relative;transition:background .3s}
.v .n{font-family:var(--f-display);font-size:.62em;color:var(--gold);margin-inline-end:.45em;vertical-align:.15em;user-select:none}
.v.active{background:var(--gold-soft)}
.w{cursor:pointer;border-radius:5px;transition:color .25s}
.w.said{color:var(--said)}
.w.cur{color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}
.endv{color:var(--gold);font-size:.8em}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 18px;box-shadow:0 10px 30px rgba(10,14,25,.18);max-width:min(36rem,calc(100% - 32px))}
#mic{width:54px;height:54px;flex:0 0 54px;border-radius:50%;border:0;background:var(--gold);color:var(--bg);cursor:pointer;display:grid;place-items:center;position:relative}
#mic svg{width:24px;height:24px}
#mic.on{background:var(--live)}
#mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--live);opacity:.5;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}
.status{min-width:0;flex:1}
.status strong{display:block;font-size:.95rem}
.status span{display:block;font-family:var(--f-text);font-size:.95rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
#follow{font:600 .8rem var(--f-ui);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
#follow.on{color:var(--gold);border-color:var(--gold)}
.hint{max-width:46rem;margin:0 auto;color:var(--muted);font-size:.92rem;line-height:1.6;padding-block:14px 0}
@media (max-width:480px){.head h2{font-size:2rem}#follow{display:none}}
@media (prefers-reduced-motion:reduce){#mic.on::after{animation:none}.v,.w{transition:none}}
</style>

<header>

<div class="dock">
  <div class="dock-in">

    <button id="follow" class="on" aria-pressed="true">גלילה אוטומטית</button>
    <button id="mic" aria-label="התחלת הקשבה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
</div>
</div>

<script>
const DATA = [{"id":"open","kind":"prayer","title":"לפני האמירה","verses":["הֲרֵינִי מְקַשֵּׁר עַצְמִי בַּאֲמִירַת עֲשָׂרָה מִזְמוֹרִים אֵלּוּ לְכָל הַצַּדִּיקִים הָאֲמִתִּיִּים שֶׁבְּדוֹרֵנוּ, וּלְכָל הַצַּדִּיקִים הָאֲמִתִּיִּים שׁוֹכְנֵי עָפָר, קְדוֹשִׁים אֲשֶׁר בָּאָרֶץ הֵמָּה, וּבִפְרָט לְרַבֵּנוּ הַקָּדוֹשׁ, צַדִּיק יְסוֹד עוֹלָם, נַחַל נוֹבֵעַ מְקוֹר חָכְמָה, רַבֵּנוּ נַחְמָן בֶּן פֵיגָא, זְכוּתוֹ יָגֵן עָלֵינוּ, שֶׁגִּלָּה תִּקּוּן זֶה.","לְכוּ נְרַנְּנָה לַיהֹוָה נָרִיעָה לְצוּר יִשְׁעֵנוּ","נְקַדְּמָה פָנָיו בְּתוֹדָה בִּזְמִרוֹת נָרִיעַ לוֹ","כִּי אֵל גָּדוֹל יְהֹוָה וּמֶלֶךְ גָּדוֹל עַל־כָּל־אֱלֹהִים"]},{"id":"p16","kind":"psalm","num":16,"title":"מזמור ט״ז","verses":["מִכְתָּם לְדָוִד שָׁמְרֵנִי אֵל כִּי־חָסִיתִי בָךְ","אָמַרְתְּ לַיהֹוָה אֲדֹנָי אָתָּה טוֹבָתִי בַּל־עָלֶיךָ","לִקְדוֹשִׁים אֲשֶׁר־בָּאָרֶץ הֵמָּה וְאַדִּירֵי כָּל־חֶפְצִי־בָם","יִרְבּוּ עַצְּבוֹתָם אַחֵר מָהָרוּ בַּל־אַסִּיךְ נִסְכֵּיהֶם מִדָּם וּבַל־אֶשָּׂא אֶת־שְׁמוֹתָם עַל־שְׂפָתָי","יְהֹוָה מְנָת־חֶלְקִי וְכוֹסִי אַתָּה תּוֹמִיךְ גּוֹרָלִי","חֲבָלִים נָפְלוּ־לִי בַּנְּעִמִים אַף־נַחֲלָת שָׁפְרָה עָלָי","אֲבָרֵךְ אֶת־יְהֹוָה אֲשֶׁר יְעָצָנִי אַף־לֵילוֹת יִסְּרוּנִי כִלְיוֹתָי","שִׁוִּיתִי יְהֹוָה לְנֶגְדִּי תָמִיד כִּי מִימִינִי בַּל־אֶמּוֹט","לָכֵן שָׂמַח לִבִּי וַיָּגֶל כְּבוֹדִי אַף־בְּשָׂרִי יִשְׁכֹּן לָבֶטַח","כִּי לֹא־תַעֲזֹב נַפְשִׁי לִשְׁאוֹל לֹא־תִתֵּן חֲסִידְךָ לִרְאוֹת שָׁחַת","תּוֹדִיעֵנִי אֹרַח חַיִּים שֹׂבַע שְׂמָחוֹת אֶת־פָּנֶיךָ נְעִמוֹת בִּימִינְךָ נֶצַח"]},{"id":"p32","kind":"psalm","num":32,"title":"מזמור ל״ב","verses":["לְדָוִד מַשְׂכִּיל אַשְׁרֵי נְשׂוּי־פֶּשַׁע כְּסוּי חֲטָאָה","אַשְׁרֵי־אָדָם לֹא יַחְשֹׁב יְהֹוָה לוֹ עָוֹן וְאֵין בְּרוּחוֹ רְמִיָּה","כִּי־הֶחֱרַשְׁתִּי בָּלוּ עֲצָמָי בְּשַׁאֲגָתִי כָּל־הַיּוֹם","כִּי יוֹמָם וָלַיְלָה תִּכְבַּד עָלַי יָדֶךָ נֶהְפַּךְ לְשַׁדִּי בְּחַרְבֹנֵי קַיִץ סֶלָה","חַטָּאתִי אוֹדִיעֲךָ וַעֲוֹנִי לֹא־כִסִּיתִי אָמַרְתִּי אוֹדֶה עֲלֵי פְשָׁעַי לַיהֹוָה וְאַתָּה נָשָׂאתָ עֲוֹן חַטָּאתִי סֶלָה","עַל־זֹאת יִתְפַּלֵּל כָּל־חָסִיד אֵלֶיךָ לְעֵת מְצֹא רַק לְשֵׁטֶף מַיִם רַבִּים אֵלָיו לֹא יַגִּיעוּ","אַתָּה סֵתֶר לִי מִצַּר תִּצְּרֵנִי רָנֵּי פַלֵּט תְּסוֹבְבֵנִי סֶלָה","אַשְׂכִּילְךָ וְאוֹרְךָ בְּדֶרֶךְ־זוּ תֵלֵךְ אִיעֲצָה עָלֶיךָ עֵינִי","אַל־תִּהְיוּ כְּסוּס כְּפֶרֶד אֵין הָבִין בְּמֶתֶג־וָרֶסֶן עֶדְיוֹ לִבְלוֹם בַּל קְרֹב אֵלֶיךָ","רַבִּים מַכְאוֹבִים לָרָשָׁע וְהַבּוֹטֵחַ בַּיהֹוָה חֶסֶד יְסוֹבְבֶנּוּ","שִׂמְחוּ בַיהֹוָה וְגִילוּ צַדִּיקִים וְהַרְנִינוּ כָּל־יִשְׁרֵי־לֵב"]},{"id":"p41","kind":"psalm","num":41,"title":"מזמור מ״א","verses":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִד","אַשְׁרֵי מַשְׂכִּיל אֶל־דָּל בְּיוֹם רָעָה יְמַלְּטֵהוּ יְהֹוָה","יְהֹוָה יִשְׁמְרֵהוּ וִיחַיֵּהוּ וְאֻשַּׁר בָּאָרֶץ וְאַל־תִּתְּנֵהוּ בְּנֶפֶשׁ אֹיְבָיו","יְהֹוָה יִסְעָדֶנּוּ עַל־עֶרֶשׂ דְּוָי כָּל־מִשְׁכָּבוֹ הָפַכְתָּ בְחָלְיוֹ","אֲנִי־אָמַרְתִּי יְהֹוָה חָנֵּנִי רְפָאָה נַפְשִׁי כִּי־חָטָאתִי לָךְ","אוֹיְבַי יֹאמְרוּ רַע לִי מָתַי יָמוּת וְאָבַד שְׁמוֹ","וְאִם־בָּא לִרְאוֹת שָׁוְא יְדַבֵּר לִבּוֹ יִקְבָּץ־אָוֶן לוֹ יֵצֵא לַחוּץ יְדַבֵּר","יַחַד עָלַי יִתְלַחֲשׁוּ כָּל־שֹׂנְאָי עָלַי יַחְשְׁבוּ רָעָה לִי","דְּבַר־בְּלִיַּעַל יָצוּק בּוֹ וַאֲשֶׁר שָׁכַב לֹא־יוֹסִיף לָקוּם","גַּם־אִישׁ שְׁלוֹמִי אֲשֶׁר־בָּטַחְתִּי בוֹ אוֹכֵל לַחְמִי הִגְדִּיל עָלַי עָקֵב","וְאַתָּה יְהֹוָה חָנֵּנִי וַהֲקִימֵנִי וַאֲשַׁלְּמָה לָהֶם","בְּזֹאת יָדַעְתִּי כִּי־חָפַצְתָּ בִּי כִּי לֹא־יָרִיעַ אֹיְבִי עָלָי","וַאֲנִי בְּתֻמִּי תָּמַכְתָּ בִּי וַתַּצִּיבֵנִי לְפָנֶיךָ לְעוֹלָם","בָּרוּךְ יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל מֵהָעוֹלָם וְעַד הָעוֹלָם אָמֵן וְאָמֵן"]},{"id":"p42","kind":"psalm","num":42,"title":"מזמור מ״ב","verses":["לַמְנַצֵּחַ מַשְׂכִּיל לִבְנֵי־קֹרַח","כְּאַיָּל תַּעֲרֹג עַל־אֲפִיקֵי־מָיִם כֵּן נַפְשִׁי תַעֲרֹג אֵלֶיךָ אֱלֹהִים","צָמְאָה נַפְשִׁי לֵאלֹהִים לְאֵל חָי מָתַי אָבוֹא וְאֵרָאֶה פְּנֵי אֱלֹהִים","הָיְתָה־לִּי דִמְעָתִי לֶחֶם יוֹמָם וָלָיְלָה בֶּאֱמֹר אֵלַי כָּל־הַיּוֹם אַיֵּה אֱלֹהֶיךָ","אֵלֶּה אֶזְכְּרָה וְאֶשְׁפְּכָה עָלַי נַפְשִׁי כִּי אֶעֱבֹר בַּסָּךְ אֶדַּדֵּם עַד־בֵּית־אֱלֹהִים בְּקוֹל־רִנָּה וְתוֹדָה הָמוֹן חוֹגֵג","מַה־תִּשְׁתּוֹחֲחִי נַפְשִׁי וַתֶּהֱמִי עָלָי הוֹחִלִי לֵאלֹהִים כִּי־עוֹד אוֹדֶנּוּ יְשׁוּעוֹת פָּנָיו","אֱלֹהַי עָלַי נַפְשִׁי תִשְׁתּוֹחָח עַל־כֵּן אֶזְכָּרְךָ מֵאֶרֶץ יַרְדֵּן וְחֶרְמוֹנִים מֵהַר מִצְעָר","תְּהוֹם־אֶל־תְּהוֹם קוֹרֵא לְקוֹל צִנּוֹרֶיךָ כָּל־מִשְׁבָּרֶיךָ וְגַלֶּיךָ עָלַי עָבָרוּ","יוֹמָם יְצַוֶּה יְהֹוָה חַסְדּוֹ וּבַלַּיְלָה שִׁירֹה עִמִּי תְּפִלָּה לְאֵל חַיָּי","אוֹמְרָה לְאֵל סַלְעִי לָמָה שְׁכַחְתָּנִי לָמָּה־קֹדֵר אֵלֵךְ בְּלַחַץ אוֹיֵב","בְּרֶצַח בְּעַצְמוֹתַי חֵרְפוּנִי צוֹרְרָי בְּאָמְרָם אֵלַי כָּל־הַיּוֹם אַיֵּה אֱלֹהֶיךָ","מַה־תִּשְׁתּוֹחֲחִי נַפְשִׁי וּמַה־תֶּהֱמִי עָלָי הוֹחִילִי לֵאלֹהִים כִּי־עוֹד אוֹדֶנּוּ יְשׁוּעֹת פָּנַי וֵאלֹהָי"]},{"id":"p59","kind":"psalm","num":59,"title":"מזמור נ״ט","verses":["לַמְנַצֵּחַ אַל־תַּשְׁחֵת לְדָוִד מִכְתָּם בִּשְׁלֹחַ שָׁאוּל וַיִּשְׁמְרוּ אֶת־הַבַּיִת לַהֲמִיתוֹ","הַצִּילֵנִי מֵאֹיְבַי אֱלֹהָי מִמִּתְקוֹמְמַי תְּשַׂגְּבֵנִי","הַצִּילֵנִי מִפֹּעֲלֵי אָוֶן וּמֵאַנְשֵׁי דָמִים הוֹשִׁיעֵנִי","כִּי הִנֵּה אָרְבוּ לְנַפְשִׁי יָגוּרוּ עָלַי עַזִּים לֹא־פִשְׁעִי וְלֹא־חַטָּאתִי יְהֹוָה","בְּלִי־עָוֹן יְרֻצוּן וְיִכּוֹנָנוּ עוּרָה לִקְרָאתִי וּרְאֵה","וְאַתָּה יְהֹוָה־אֱלֹהִים צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל הָקִיצָה לִפְקֹד כָּל־הַגּוֹיִם אַל־תָּחֹן כָּל־בֹּגְדֵי אָוֶן סֶלָה","יָשׁוּבוּ לָעֶרֶב יֶהֱמוּ כַכָּלֶב וִיסוֹבְבוּ עִיר","הִנֵּה יַבִּיעוּן בְּפִיהֶם חֲרָבוֹת בְּשִׂפְתוֹתֵיהֶם כִּי־מִי שֹׁמֵעַ","וְאַתָּה יְהֹוָה תִּשְׂחַק־לָמוֹ תִּלְעַג לְכָל־גּוֹיִם","עֻזּוֹ אֵלֶיךָ אֶשְׁמֹרָה כִּי־אֱלֹהִים מִשְׂגַּבִּי","אֱלֹהֵי חַסְדִּי יְקַדְּמֵנִי אֱלֹהִים יַרְאֵנִי בְשֹׁרְרָי","אַל־תַּהַרְגֵם פֶּן־יִשְׁכְּחוּ עַמִּי הֲנִיעֵמוֹ בְחֵילְךָ וְהוֹרִידֵמוֹ מָגִנֵּנוּ אֲדֹנָי","חַטַּאת־פִּימוֹ דְּבַר־שְׂפָתֵימוֹ וְיִלָּכְדוּ בִגְאוֹנָם וּמֵאָלָה וּמִכַּחַשׁ יְסַפֵּרוּ","כַּלֵּה בְחֵמָה כַּלֵּה וְאֵינֵמוֹ וְיֵדְעוּ כִּי־אֱלֹהִים מֹשֵׁל בְּיַעֲקֹב לְאַפְסֵי הָאָרֶץ סֶלָה","וְיָשֻׁבוּ לָעֶרֶב יֶהֱמוּ כַכָּלֶב וִיסוֹבְבוּ עִיר","הֵמָּה יְנִיעוּן לֶאֱכֹל אִם־לֹא יִשְׂבְּעוּ וַיָּלִינוּ","וַאֲנִי אָשִׁיר עֻזֶּךָ וַאֲרַנֵּן לַבֹּקֶר חַסְדֶּךָ כִּי־הָיִיתָ מִשְׂגָּב לִי וּמָנוֹס בְּיוֹם צַר־לִי","עֻזִּי אֵלֶיךָ אֲזַמֵּרָה כִּי־אֱלֹהִים מִשְׂגַּבִּי אֱלֹהֵי חַסְדִּי"]},{"id":"p77","kind":"psalm","num":77,"title":"מזמור ע״ז","verses":["לַמְנַצֵּחַ עַל־יְדוּתוּן לְאָסָף מִזְמוֹר","קוֹלִי אֶל־אֱלֹהִים וְאֶצְעָקָה קוֹלִי אֶל־אֱלֹהִים וְהַאֲזִין אֵלָי","בְּיוֹם צָרָתִי אֲדֹנָי דָּרָשְׁתִּי יָדִי לַיְלָה נִגְּרָה וְלֹא תָפוּג מֵאֲנָה הִנָּחֵם נַפְשִׁי","אֶזְכְּרָה אֱלֹהִים וְאֶהֱמָיָה אָשִׂיחָה וְתִתְעַטֵּף רוּחִי סֶלָה","אָחַזְתָּ שְׁמֻרוֹת עֵינָי נִפְעַמְתִּי וְלֹא אֲדַבֵּר","חִשַּׁבְתִּי יָמִים מִקֶּדֶם שְׁנוֹת עוֹלָמִים","אֶזְכְּרָה נְגִינָתִי בַּלָּיְלָה עִם־לְבָבִי אָשִׂיחָה וַיְחַפֵּשׂ רוּחִי","הַלְעוֹלָמִים יִזְנַח אֲדֹנָי וְלֹא־יֹסִיף לִרְצוֹת עוֹד","הֶאָפֵס לָנֶצַח חַסְדּוֹ גָּמַר אֹמֶר לְדֹר וָדֹר","הֲשָׁכַח חַנּוֹת אֵל אִם־קָפַץ בְּאַף רַחֲמָיו סֶלָה","וָאֹמַר חַלּוֹתִי הִיא שְׁנוֹת יְמִין עֶלְיוֹן","אֶזְכּוֹר מַעַלְלֵי־יָהּ כִּי־אֶזְכְּרָה מִקֶּדֶם פִּלְאֶךָ","וְהָגִיתִי בְכָל־פָּעֳלֶךָ וּבַעֲלִילוֹתֶיךָ אָשִׂיחָה","אֱלֹהִים בַּקֹּדֶשׁ דַּרְכֶּךָ מִי־אֵל גָּדוֹל כֵּאלֹהִים","אַתָּה הָאֵל עֹשֵׂה פֶלֶא הוֹדַעְתָּ בָעַמִּים עֻזֶּךָ","גָּאַלְתָּ בִּזְרוֹעַ עַמֶּךָ בְּנֵי־יַעֲקֹב וְיוֹסֵף סֶלָה","רָאוּךָ מַּיִם אֱלֹהִים רָאוּךָ מַּיִם יָחִילוּ אַף יִרְגְּזוּ תְהֹמוֹת","זֹרְמוּ מַיִם עָבוֹת קוֹל נָתְנוּ שְׁחָקִים אַף־חֲצָצֶיךָ יִתְהַלָּכוּ","קוֹל רַעַמְךָ בַּגַּלְגַּל הֵאִירוּ בְרָקִים תֵּבֵל רָגְזָה וַתִּרְעַשׁ הָאָרֶץ","בַּיָּם דַּרְכֶּךָ וּשְׁבִילְךָ בְּמַיִם רַבִּים וְעִקְּבוֹתֶיךָ לֹא נֹדָעוּ","נָחִיתָ כַצֹּאן עַמֶּךָ בְּיַד־מֹשֶׁה וְאַהֲרֹן"]},{"id":"p90","kind":"psalm","num":90,"title":"מזמור צ׳","verses":["תְּפִלָּה לְמֹשֶׁה אִישׁ־הָאֱלֹהִים אֲדֹנָי מָעוֹן אַתָּה הָיִיתָ לָּנוּ בְּדֹר וָדֹר","בְּטֶרֶם הָרִים יֻלָּדוּ וַתְּחוֹלֵל אֶרֶץ וְתֵבֵל וּמֵעוֹלָם עַד־עוֹלָם אַתָּה אֵל","תָּשֵׁב אֱנוֹשׁ עַד־דַּכָּא וַתֹּאמֶר שׁוּבוּ בְנֵי־אָדָם","כִּי אֶלֶף שָׁנִים בְּעֵינֶיךָ כְּיוֹם אֶתְמוֹל כִּי יַעֲבֹר וְאַשְׁמוּרָה בַלָּיְלָה","זְרַמְתָּם שֵׁנָה יִהְיוּ בַּבֹּקֶר כֶּחָצִיר יַחֲלֹף","בַּבֹּקֶר יָצִיץ וְחָלָף לָעֶרֶב יְמוֹלֵל וְיָבֵשׁ","כִּי־כָלִינוּ בְאַפֶּךָ וּבַחֲמָתְךָ נִבְהָלְנוּ","שַׁתָּ עֲוֹנֹתֵינוּ לְנֶגְדֶּךָ עֲלֻמֵנוּ לִמְאוֹר פָּנֶיךָ","כִּי כָל־יָמֵינוּ פָּנוּ בְעֶבְרָתֶךָ כִּלִּינוּ שָׁנֵינוּ כְמוֹ־הֶגֶה","יְמֵי־שְׁנוֹתֵינוּ בָהֶם שִׁבְעִים שָׁנָה וְאִם בִּגְבוּרֹת שְׁמוֹנִים שָׁנָה וְרָהְבָּם עָמָל וָאָוֶן כִּי־גָז חִישׁ וַנָּעֻפָה","מִי־יוֹדֵעַ עֹז אַפֶּךָ וּכְיִרְאָתְךָ עֶבְרָתֶךָ","לִמְנוֹת יָמֵינוּ כֵּן הוֹדַע וְנָבִא לְבַב חָכְמָה","שׁוּבָה יְהֹוָה עַד־מָתָי וְהִנָּחֵם עַל־עֲבָדֶיךָ","שַׂבְּעֵנוּ בַבֹּקֶר חַסְדֶּךָ וּנְרַנְּנָה וְנִשְׂמְחָה בְּכָל־יָמֵינוּ","שַׂמְּחֵנוּ כִּימוֹת עִנִּיתָנוּ שְׁנוֹת רָאִינוּ רָעָה","יֵרָאֶה אֶל־עֲבָדֶיךָ פָעֳלֶךָ וַהֲדָרְךָ עַל־בְּנֵיהֶם","וִיהִי נֹעַם אֲדֹנָי אֱלֹהֵינוּ עָלֵינוּ וּמַעֲשֵׂה יָדֵינוּ כּוֹנְנָה עָלֵינוּ וּמַעֲשֵׂה יָדֵינוּ כּוֹנְנֵהוּ"]},{"id":"p105","kind":"psalm","num":105,"title":"מזמור ק״ה","verses":["הוֹדוּ לַיהֹוָה קִרְאוּ בִשְׁמוֹ הוֹדִיעוּ בָעַמִּים עֲלִילוֹתָיו","שִׁירוּ־לוֹ זַמְּרוּ־לוֹ שִׂיחוּ בְּכָל־נִפְלְאוֹתָיו","הִתְהַלְלוּ בְּשֵׁם קָדְשׁוֹ יִשְׂמַח לֵב מְבַקְשֵׁי יְהֹוָה","דִּרְשׁוּ יְהֹוָה וְעֻזּוֹ בַּקְּשׁוּ פָנָיו תָּמִיד","זִכְרוּ נִפְלְאוֹתָיו אֲשֶׁר־עָשָׂה מֹפְתָיו וּמִשְׁפְּטֵי־פִיו","זֶרַע אַבְרָהָם עַבְדּוֹ בְּנֵי יַעֲקֹב בְּחִירָיו","הוּא יְהֹוָה אֱלֹהֵינוּ בְּכָל־הָאָרֶץ מִשְׁפָּטָיו","זָכַר לְעוֹלָם בְּרִיתוֹ דָּבָר צִוָּה לְאֶלֶף דּוֹר","אֲשֶׁר כָּרַת אֶת־אַבְרָהָם וּשְׁבוּעָתוֹ לְיִשְׂחָק","וַיַּעֲמִידֶהָ לְיַעֲקֹב לְחֹק לְיִשְׂרָאֵל בְּרִית עוֹלָם","לֵאמֹר לְךָ אֶתֵּן אֶת־אֶרֶץ־כְּנָעַן חֶבֶל נַחֲלַתְכֶם","בִּהְיוֹתָם מְתֵי מִסְפָּר כִּמְעַט וְגָרִים בָּהּ","וַיִּתְהַלְּכוּ מִגּוֹי אֶל־גּוֹי מִמַּמְלָכָה אֶל־עַם אַחֵר","לֹא־הִנִּיחַ אָדָם לְעָשְׁקָם וַיּוֹכַח עֲלֵיהֶם מְלָכִים","אַל־תִּגְּעוּ בִמְשִׁיחָי וְלִנְבִיאַי אַל־תָּרֵעוּ","וַיִּקְרָא רָעָב עַל־הָאָרֶץ כָּל־מַטֵּה־לֶחֶם שָׁבָר","שָׁלַח לִפְנֵיהֶם אִישׁ לְעֶבֶד נִמְכַּר יוֹסֵף","עִנּוּ בַכֶּבֶל רַגְלוֹ בַּרְזֶל בָּאָה נַפְשׁוֹ","עַד־עֵת בֹּא־דְבָרוֹ אִמְרַת יְהֹוָה צְרָפָתְהוּ","שָׁלַח מֶלֶךְ וַיַּתִּירֵהוּ מֹשֵׁל עַמִּים וַיְפַתְּחֵהוּ","שָׂמוֹ אָדוֹן לְבֵיתוֹ וּמֹשֵׁל בְּכָל־קִנְיָנוֹ","לֶאְסֹר שָׂרָיו בְּנַפְשׁוֹ וּזְקֵנָיו יְחַכֵּם","וַיָּבֹא יִשְׂרָאֵל מִצְרָיִם וְיַעֲקֹב גָּר בְּאֶרֶץ־חָם","וַיֶּפֶר אֶת־עַמּוֹ מְאֹד וַיַּעֲצִמֵהוּ מִצָּרָיו","הָפַךְ לִבָּם לִשְׂנֹא עַמּוֹ לְהִתְנַכֵּל בַּעֲבָדָיו","שָׁלַח מֹשֶׁה עַבְדּוֹ אַהֲרֹן אֲשֶׁר בָּחַר־בּוֹ","שָׂמוּ־בָם דִּבְרֵי אֹתוֹתָיו וּמֹפְתִים בְּאֶרֶץ חָם","שָׁלַח חֹשֶׁךְ וַיַּחְשִׁךְ וְלֹא־מָרוּ אֶת־דְּבָרוֹ","הָפַךְ אֶת־מֵימֵיהֶם לְדָם וַיָּמֶת אֶת־דְּגָתָם","שָׁרַץ אַרְצָם צְפַרְדְּעִים בְּחַדְרֵי מַלְכֵיהֶם","אָמַר וַיָּבֹא עָרֹב כִּנִּים בְּכָל־גְּבוּלָם","נָתַן גִּשְׁמֵיהֶם בָּרָד אֵשׁ לֶהָבוֹת בְּאַרְצָם","וַיַּךְ גַּפְנָם וּתְאֵנָתָם וַיְשַׁבֵּר עֵץ גְּבוּלָם","אָמַר וַיָּבֹא אַרְבֶּה וְיֶלֶק וְאֵין מִסְפָּר","וַיֹּאכַל כָּל־עֵשֶׂב בְּאַרְצָם וַיֹּאכַל פְּרִי אַדְמָתָם","וַיַּךְ כָּל־בְּכוֹר בְּאַרְצָם רֵאשִׁית לְכָל־אוֹנָם","וַיּוֹצִיאֵם בְּכֶסֶף וְזָהָב וְאֵין בִּשְׁבָטָיו כּוֹשֵׁל","שָׂמַח מִצְרַיִם בְּצֵאתָם כִּי־נָפַל פַּחְדָּם עֲלֵיהֶם","פָּרַשׂ עָנָן לְמָסָךְ וְאֵשׁ לְהָאִיר לָיְלָה","שָׁאַל וַיָּבֵא שְׂלָו וְלֶחֶם שָׁמַיִם יַשְׂבִּיעֵם","פָּתַח צוּר וַיָּזוּבוּ מָיִם הָלְכוּ בַּצִּיּוֹת נָהָר","כִּי־זָכַר אֶת־דְּבַר קָדְשׁוֹ אֶת־אַבְרָהָם עַבְדּוֹ","וַיּוֹצִא עַמּוֹ בְשָׂשׂוֹן בְּרִנָּה אֶת־בְּחִירָיו","וַיִּתֵּן לָהֶם אַרְצוֹת גּוֹיִם וַעֲמַל לְאֻמִּים יִירָשׁוּ","בַּעֲבוּר יִשְׁמְרוּ חֻקָּיו וְתוֹרֹתָיו יִנְצֹרוּ הַלְלוּ־יָהּ"]},{"id":"p137","kind":"psalm","num":137,"title":"מזמור קל״ז","verses":["עַל־נַהֲרוֹת בָּבֶל שָׁם יָשַׁבְנוּ גַּם־בָּכִינוּ בְּזָכְרֵנוּ אֶת־צִיּוֹן","עַל־עֲרָבִים בְּתוֹכָהּ תָּלִינוּ כִּנֹּרוֹתֵינוּ","כִּי שָׁם שְׁאֵלוּנוּ שׁוֹבֵינוּ דִּבְרֵי־שִׁיר וְתוֹלָלֵינוּ שִׂמְחָה שִׁירוּ לָנוּ מִשִּׁיר צִיּוֹן","אֵיךְ נָשִׁיר אֶת־שִׁיר־יְהֹוָה עַל אַדְמַת נֵכָר","אִם־אֶשְׁכָּחֵךְ יְרוּשָׁלִָם תִּשְׁכַּח יְמִינִי","תִּדְבַּק־לְשׁוֹנִי לְחִכִּי אִם־לֹא אֶזְכְּרֵכִי אִם־לֹא אַעֲלֶה אֶת־יְרוּשָׁלִַם עַל רֹאשׁ שִׂמְחָתִי","זְכֹר יְהֹוָה לִבְנֵי אֱדוֹם אֵת יוֹם יְרוּשָׁלִָם הָאֹמְרִים עָרוּ עָרוּ עַד הַיְסוֹד בָּהּ","בַּת־בָּבֶל הַשְּׁדוּדָה אַשְׁרֵי שֶׁיְשַׁלֶּם־לָךְ אֶת־גְּמוּלֵךְ שֶׁגָּמַלְתְּ לָנוּ","אַשְׁרֵי שֶׁיֹּאחֵז וְנִפֵּץ אֶת־עֹלָלַיִךְ אֶל־הַסָּלַע"]},{"id":"p150","kind":"psalm","num":150,"title":"מזמור ק״נ","verses":["הַלְלוּ־יָהּ הַלְלוּ־אֵל בְּקָדְשׁוֹ הַלְלוּהוּ בִּרְקִיעַ עֻזּוֹ","הַלְלוּהוּ בִגְבוּרֹתָיו הַלְלוּהוּ כְּרֹב גֻּדְלוֹ","הַלְלוּהוּ בְּתֵקַע שׁוֹפָר הַלְלוּהוּ בְּנֵבֶל וְכִנּוֹר","הַלְלוּהוּ בְּתֹף וּמָחוֹל הַלְלוּהוּ בְּמִנִּים וְעֻגָב","הַלְלוּהוּ בְצִלְצְלֵי־שָׁמַע הַלְלוּהוּ בְּצִלְצְלֵי תְרוּעָה","כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ הַלְלוּ־יָהּ"]},{"id":"close","kind":"prayer","title":"אחרי האמירה","verses":["מִי־יִתֵּן מִצִּיּוֹן יְשׁוּעַת יִשְׂרָאֵל בְּשׁוּב יְהֹוָה שְׁבוּת עַמּוֹ יָגֵל יַעֲקֹב יִשְׂמַח יִשְׂרָאֵל","וּתְשׁוּעַת צַדִּיקִים מֵיְהֹוָה מָעוּזָּם בְּעֵת צָרָה","וַיַּעְזְרֵם יְהֹוָה וַיְפַלְּטֵם יְפַלְּטֵם מֵרְשָׁעִים וְיוֹשִׁיעֵם כִּי־חָסוּ בוֹ"]}];

/* ---------- build text + tokens ---------- */
const FIN={"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
const cons=s=>s.replace(/[^א-ת]/g,"").replace(/[ךםןףץ]/g,c=>FIN[c]);
const PFX=["","ו","ל","ב","מ","כ","ה","וב","ול","ומ","וכ","ש"];
const DIV_T=new Set(["יהוה","אדני"]), DIV_S=new Set(["יהוה","אדני","אדוני","השמ","הויה","אדושמ"]);
function keyOf(c,spoken){
  if(!c) return "";
  if(spoken){ c=c.replace(/אלוק/g,"אלוה").replace(/אלקי/g,"אלהי").replace(/^קה$/,"יה"); if(c==="השמ"||c==="אדוני") return "@"; }
  const set=spoken?DIV_S:DIV_T;
  for(const p of PFX){ if(c.startsWith(p)&&set.has(c.slice(p.length))) return p.replace(/[וי]/g,"ו")+"@"; }
  const k=c.replace(/[וי]/g,"");
  return k.length?k:c;
}
const toks=[]; // {k, w}
const words=[]; // span elements
const wordTok=[]; // first token index per word
const wordVerse=[]; // verse element per word
const secOfWord=[];
const verseNo=[];
function heNum(n){const o=["","א","ב","ג","ד","ה","ו","ז","ח","ט"],t=["","י","כ","ל","מ"];if(n===15)return"ט״ו";if(n===16)return"ט״ז";let s=t[Math.floor(n/10)]+o[n%10];return s.length>1?s.slice(0,-1)+"״"+s.slice(-1):s+"׳";}
const main=document.getElementById("text"), chips=document.getElementById("chips");
const secEls=[], chipEls=[];
const psalmCount=DATA.filter(s=>s.kind==="psalm").length;
let pi=0;
DATA.forEach((s,si)=>{
  const sec=document.createElement("section"); sec.className=s.kind; sec.id=s.id;
  const head=document.createElement("div"); head.className="head";
  if(s.kind==="psalm"){pi++; head.innerHTML=`<span class="lbl">${pi} מתוך ${psalmCount}</span><h2>${s.title}</h2><span class="rule"></span>`;}
  else head.innerHTML=`<h2>${s.title}</h2><span class="rule"></span>`;
  sec.appendChild(head);
  s.verses.forEach((v,vi)=>{
    const p=document.createElement("p"); p.className="v";
    if(s.kind==="psalm"){const n=document.createElement("span");n.className="n";n.textContent=heNum(vi+1);p.appendChild(n);}
    v.split(" ").forEach((w,j)=>{
      const sp=document.createElement("span"); sp.className="w"; sp.textContent=w; sp.dataset.i=words.length;
      wordTok.push(toks.length); wordVerse.push(p); secOfWord.push(si); verseNo.push(vi+1);
      w.split("־").forEach(piece=>{const k=keyOf(cons(piece),false); if(k) toks.push({k,w:words.length});});
      words.push(sp); p.appendChild(sp); p.appendChild(document.createTextNode(" "));
    });
    if(s.kind==="psalm"){const e=document.createElement("span");e.className="endv";e.textContent=":";p.appendChild(e);}
    sec.appendChild(p);
  });
  main.appendChild(sec); secEls.push(sec);
  const c=document.createElement("button"); c.className="chip"; c.textContent=s.kind==="psalm"?s.title.replace("מזמור ",""):(si===0?"פתיחה":"סיום");
  c.onclick=()=>jumpTo(wordTok.findIndex((_,i)=>secOfWord[i]===si));
  chips.appendChild(c); chipEls.push(c);
});

/* ---------- position + highlight ---------- */
let curW=-1, nextTok=0;
function setWord(wi,{scroll=true}={}){
  wi=Math.max(0,Math.min(words.length-1,wi));
  const old=curW; curW=wi;
  if(old>=0){ words[old].classList.remove("cur"); wordVerse[old].classList.remove("active"); }
  const a=Math.min(old<0?0:old,wi), b=Math.max(old<0?0:old,wi);
  if(old<0){ for(let i=0;i<words.length;i++) words[i].classList.toggle("said",i<wi); }
  else for(let i=a;i<=b;i++) words[i].classList.toggle("said",i<wi);
  words[wi].classList.add("cur"); wordVerse[wi].classList.add("active");
  const si=secOfWord[wi], s=DATA[si];
  document.getElementById("where").innerHTML = s.kind==="psalm" ? `${s.title} · <span>פסוק ${heNum(verseNo[wi])}</span>` : s.title;
  chipEls.forEach((c,i)=>{c.classList.toggle("on",i===si);c.classList.toggle("done",i<si);});
  if(old<0||secOfWord[old]!==si) chipEls[si].scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  if(scroll) follow();
  try{localStorage.setItem("tk-pos",String(wi));}catch(e){}
}
function jumpTo(wi){ nextTok=wordTok[wi]; setWord(wi); centerNow(true); }
words.forEach(w=>w.addEventListener("click",()=>{ const i=+w.dataset.i; nextTok=wordTok[i]; setWord(i); }));

/* ---------- scrolling ---------- */
let followOn=true, manualUntil=0;
const fbtn=document.getElementById("follow");
fbtn.onclick=()=>{followOn=!followOn;fbtn.classList.toggle("on",followOn);fbtn.setAttribute("aria-pressed",followOn);if(followOn)centerNow(true);};
["wheel","touchmove"].forEach(e=>addEventListener(e,()=>{manualUntil=Date.now()+5000;},{passive:true}));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function centerNow(force){
  if(curW<0) return;
  const r=words[curW].getBoundingClientRect();
  const target=innerHeight*0.38;
  if(force||Math.abs(r.top-target)>innerHeight*0.12) scrollBy({top:r.top-target,behavior:reduce?"auto":"smooth"});
}
function follow(){ if(followOn&&Date.now()>manualUntil) centerNow(false); }

/* ---------- matching ---------- */
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const simCache=new Map();
function sim(a,b){
  if(a===b) return 1;
  const key=a+"|"+b; if(simCache.has(key)) return simCache.get(key);
  let s=0; const L=Math.min(a.length,b.length);
  if(L>=2){const d=lev(a,b); if(d===1&&L>=3) s=.7; else if(d===1) s=.45; else if(d===2&&L>=5) s=.45;}
  simCache.set(key,s); return s;
}
// local alignment of spoken tail against text tokens [lo,hi); returns best end token + score
function align(sp,lo,hi,bias){
  const m=sp.length; let prev=new Float32Array(hi-lo+1), best=-1, bj=-1;
  for(let i=1;i<=m;i++){
    const cur=new Float32Array(hi-lo+1);
    for(let j=1;j<=hi-lo;j++){
      const s=sim(sp[i-1],toks[lo+j-1].k);
      const diag=prev[j-1]+(s>0?2*s:-1.1);
      cur[j]=Math.max(0,diag,prev[j]-0.8,cur[j-1]-0.6);
    }
    prev=cur;
  }
  for(let j=1;j<=hi-lo;j++){const t=lo+j-1;const sc=prev[j]-(bias?bias(t):0);if(sc>best){best=sc;bj=t;}}
  return {tok:bj,score:best};
}
let spokenFinal=[], spokenPartial=[];
const heardEl=document.getElementById("heard");
function onSpeech(){
  const all=spokenFinal.concat(spokenPartial);
  heardEl.textContent= all.length ? all.slice(-8).join(" ") : "מקשיב…";
  const sp=all.slice(-9).map(w=>keyOf(cons(w),true)).filter(Boolean);
  if(sp.length<2) return;
  const lo=Math.max(0,nextTok-25), hi=Math.min(toks.length,nextTok+90);
  const loc=align(sp,lo,hi,t=>t<nextTok-1?(nextTok-1-t)*0.12:(t-nextTok)*0.02);
  let pick=null;
  if(loc.score>=3.2) pick=loc;
  const glob=align(sp,0,toks.length,null);
  if(glob.score>=5.4 && glob.score>=(pick?pick.score:0)+2.6) pick=glob;
  if(!pick) return;
  nextTok=pick.tok+1;
  const wi=toks[pick.tok].w;
  if(wi!==curW) setWord(wi);
}
const splitW=t=>t.replace(/[^א-ת\s'"]/g," ").split(/\s+/).filter(Boolean);

/* ---------- listening ---------- */
const mic=document.getElementById("mic"), st=document.getElementById("st");
let dict=null, rec=null, listening=false, wake=null, dictReady=false;
function ui(on,msg){listening=on;mic.classList.toggle("on",on);mic.setAttribute("aria-label",on?"עצירת הקשבה":"התחלת הקשבה");st.textContent=msg|| (on?"מקשיב לך":"מוכן להקשבה");
  if(on&&"wakeLock" in navigator&&!wake) navigator.wakeLock.request("screen").then(w=>{wake=w;w.addEventListener("release",()=>wake=null);}).catch(()=>{});
  if(!on&&wake){wake.release().catch(()=>{});wake=null;}}
const REASONS={not_granted:"אין הרשאה למיקרופון",dismissed:"ההרשאה לא אושרה — לחץ שוב",unavailable:"זיהוי דיבור בעברית לא זמין כאן",rate_limited:"עומס זמני — נסה שוב עוד רגע",upstream_error:"תקלה בזיהוי — לחץ שוב",time_limit:"עבר שעה — לחץ להמשך",hidden:"ההאזנה נעצרה כשהחלון הוסתר"};

(async()=>{
  try{ if(window.claude&&window.claude.use) dict=await window.claude.use("dictation"); }catch(e){dict=null;}
  if(dict){
    dict.onPartial(({text})=>{spokenPartial=splitW(text);onSpeech();});
    dict.onFinal(({text})=>{spokenFinal=spokenFinal.concat(splitW(text)).slice(-40);spokenPartial=[];onSpeech();});
    dict.onState(({state,reason})=>{
      if(state==="listening") ui(true);
      else if(state==="starting") st.textContent="מתחבר למיקרופון…";
      else if(state==="idle") ui(false, reason&&REASONS[reason]);
    });
  }
  dictReady=true;
})();

function startWebSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ st.textContent="זיהוי דיבור לא זמין בדפדפן הזה"; heardEl.textContent="אפשר לגעת במילה כדי לסמן מיקום"; return; }
  rec=new SR(); rec.lang="he-IL"; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{let fin=[],part=[];for(let i=e.resultIndex;i<e.results.length;i++){const w=splitW(e.results[i][0].transcript);(e.results[i].isFinal?fin:part).push(...w);}
    if(fin.length){spokenFinal=spokenFinal.concat(fin).slice(-40);} spokenPartial=part; onSpeech();};
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){rec=null;ui(false,"אין הרשאה למיקרופון — אשר גישה בהגדרות הדפדפן");}
    else if(e.error==="network"){rec=null;ui(false,"אין חיבור לאינטרנט לזיהוי הדיבור");}
  };
  rec.onend=()=>{ if(listening&&rec){ const r=rec; setTimeout(()=>{ if(rec!==r) return; try{r.start();}catch(e){ rec=null; ui(false,"ההקשבה נעצרה — לחץ שוב"); } },200); } };
  try{ rec.start(); ui(true); }catch(e){ ui(false,"לא הצלחתי להפעיל את המיקרופון"); }
}
mic.onclick=()=>{
  if(listening){
    if(dict) dict.stop().catch(()=>{});
    if(rec){const r=rec;rec=null;try{r.stop();}catch(e){}}
    ui(false,"ההקשבה נעצרה"); return;
  }
  spokenFinal=[];spokenPartial=[];
  if(dict){
    dict.start({language:"he"}).catch(err=>{ if(err&&err.code!=="stopped") ui(false,REASONS[err.code]||"לא הצלחתי להתחיל — לחץ שוב"); });
  } else if(window.claude && dictReady){
    st.textContent="המיקרופון לא זמין כאן"; heardEl.textContent="פתח בדפדפן: david2bu.github.io/tikkun-haklali";
  } else startWebSpeech();
  centerNow(true);
};

/* ---------- font size ---------- */
let size=1.55; try{const s=parseFloat(localStorage.getItem("tk-size"));if(s)size=s;}catch(e){}
const applySize=()=>{document.documentElement.style.setProperty("--size",size+"rem");try{localStorage.setItem("tk-size",size);}catch(e){}};
document.getElementById("bigger").onclick=()=>{size=Math.min(2.6,+(size+.15).toFixed(2));applySize();follow();};
document.getElementById("smaller").onclick=()=>{size=Math.max(1.05,+(size-.15).toFixed(2));applySize();follow();};
applySize();

/* ---------- start ---------- */
let start=0; try{const p=parseInt(localStorage.getItem("tk-pos"));if(p>0&&p<words.length)start=p;}catch(e){}
nextTok=wordTok[start]; setWord(start,{scroll:false});
if(start>0) requestAnimationFrame(()=>centerNow(true));
window.__tk={onSpeech,setFinal:t=>{spokenFinal=splitW(t);spokenPartial=[];onSpeech();},where:()=>document.getElementById("where").textContent};
</script>
</body></html>
